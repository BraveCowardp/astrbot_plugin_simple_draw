<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleDraw 提示词收录</title>
  <link rel="stylesheet" href="/static/app.css?v=20260520-no-x-scroll">
  <script src="/static/htmx.min.js?v=20260520-no-x-scroll" defer></script>
</head>
<body>
  <header class="compact-header">
    <div class="brand-lockup">
      <div class="mark">SD</div>
      <div>
        <p class="eyebrow">Prompt Archive</p>
        <h1>SimpleDraw 提示词收录</h1>
      </div>
    </div>
    <div class="header-actions">
      <div class="total-chip" aria-label="全部词条数">
        <span>全部词条</span>
        <b id="total-count">$total</b>
      </div>
      <button
        class="refresh-button"
        type="button"
        hx-get="/records"
        hx-target="#records"
        hx-swap="innerHTML transition:true"
        hx-indicator="#records-loading"
        aria-label="刷新记录"
      >
        <span aria-hidden="true">↻</span>
        刷新
      </button>
    </div>
  </header>

  <main class="content-panel">
    <div
      id="records"
      hx-get="/records"
      hx-trigger="load"
      hx-swap="innerHTML transition:true"
      hx-indicator="#records-loading"
    >
      <div class="empty">正在加载记录...</div>
    </div>
    <div id="records-loading" class="loading htmx-indicator">正在同步</div>
  </main>

  <div id="modal-root"></div>
  <script src="/static/app.js?v=20260520-no-x-scroll" defer></script>
</body>
</html>
