<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleDraw 提示词收录</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="side-panel">
      <div class="brand-lockup">
        <div class="mark">SD</div>
        <div>
          <p class="eyebrow">Prompt Archive</p>
          <h1>SimpleDraw</h1>
        </div>
      </div>

      <div class="archive-copy">
        <h2>提示词收录</h2>
        <p>把每次生成沉淀成可回看的视觉线索，快速复盘提示词、原消息和参考图。</p>
      </div>

      <div class="stats" aria-label="收录统计">
        <div class="stat stat-total">
          <span>全部</span>
          <b>$total</b>
        </div>
        <div class="stat">
          <span>成功</span>
          <b>$success</b>
        </div>
        <div class="stat">
          <span>失败</span>
          <b>$failed</b>
        </div>
      </div>
    </aside>

    <main class="content-panel">
      <section class="command-bar" aria-label="记录操作">
        <div>
          <p class="eyebrow">Recent Works</p>
          <h2>最近生成</h2>
        </div>
        <button
          class="refresh-button"
          type="button"
          hx-get="/records"
          hx-target="#records"
          hx-swap="innerHTML transition:true"
          hx-indicator="#records-loading"
          aria-label="刷新记录"
        >
          <span aria-hidden="true">↻</span>
          刷新
        </button>
      </section>

      <div
        id="records"
        hx-get="/records"
        hx-trigger="load"
        hx-swap="innerHTML transition:true"
        hx-indicator="#records-loading"
      >
        <div class="empty">正在加载记录...</div>
      </div>
      <div id="records-loading" class="loading htmx-indicator">正在同步</div>
    </main>
  </div>

  <div id="modal-root"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
