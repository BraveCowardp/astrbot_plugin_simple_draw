<dialog id="detail-dialog" open>
  <div class="detail-shell">
    <div class="modal">
      <div class="preview">$preview</div>
      <div class="detail">
        <div class="detail-head">
          <div>
            <p class="eyebrow">Generation Detail</p>
            <h2>$title</h2>
            <div class="meta">$created_at_text</div>
          </div>
          <button class="close" type="button" onclick="closeDetail()" aria-label="关闭">×</button>
        </div>

        <div class="detail-actions">
          <a class="back-link" href="/">返回收录页</a>
        </div>

        $group_summary

        <div class="section prompt-section">
          <div class="section-head">
            <div class="label">提示词</div>
            <button class="copy-button" type="button">复制</button>
          </div>
          <textarea class="text prompt-copy-source" readonly>$prompt</textarea>
        </div>
        <div class="section">
          <div class="label">参考图</div>
          <div class="refs">$references</div>
        </div>
        <div class="section">
          <div class="label">创作者信息</div>
          <div class="user-info">
            <div class="user-avatar">$avatar</div>
            <div class="user-meta">
              <div class="user-name">$sender</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    $group_records
  </div>
</dialog>
